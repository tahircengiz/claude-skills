<style>
/* Layout: engineering status sheet — masthead and TL;DR on top, a gauge strip below, then status columns, risks and next steps at the bottom */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --ink: #15232b; --muted: #5a6a74; --line: #d9e1e5; --accent: #0f5c7a;
  --ok: #1c7a4a; --wip: #9a6200; --stop: #b3261e; --wait: #6a4fb3; --idle: #7a8992;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1317; --surface: #141c21; --ink: #e2eaee; --muted: #8fa0aa; --line: #25313a; --accent: #5cb4d6;
  --ok: #4cc38a; --wip: #e0a43a; --stop: #f07167; --wait: #a993f0; --idle: #8396a3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1317; --surface: #141c21; --ink: #e2eaee; --muted: #8fa0aa; --line: #25313a; --accent: #5cb4d6;
  --ok: #4cc38a; --wip: #e0a43a; --stop: #f07167; --wait: #a993f0; --idle: #8396a3; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
h2 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Masthead */
.masthead { display: flex; flex-direction: column; gap: 12px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.top-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--muted); font-size: 0.82rem; }
.top-line .kind { text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--accent); }
.subtitle { color: var(--muted); margin: 0; max-width: 70ch; }
.tldr { margin: 4px 0 0; max-width: 72ch; font-size: 1.05rem; }
.tldr b { font-family: var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.85rem; margin-right: 6px; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border-radius: 999px;
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor; }
.chip svg { width: 14px; height: 14px; }
.s-done { color: var(--ok); } .s-partial { color: var(--wip); } .s-blocked { color: var(--stop); }
.s-waiting { color: var(--wait); } .s-open { color: var(--idle); } .s-attention { color: var(--wip); }

/* Gauge strip */
.strip { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: stretch; }
.ring { display: flex; align-items: center; gap: 16px; padding: 18px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.ring svg { width: 112px; height: 112px; flex: none; }
.ring .pct { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; fill: var(--ink); }
.ring .label { color: var(--muted); font-size: 0.85rem; max-width: 14ch; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.metric { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
  margin: -1px 0 0 -1px; box-shadow: inset 1px 0 0 var(--line), inset 0 1px 0 var(--line); }
.metric .l { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
.metric .v { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metric .n { color: var(--muted); font-size: 0.8rem; }
.metric.activity { grid-column: 1 / -1; }
.metric.activity svg { width: 100%; height: 56px; display: block; margin-top: 6px; }
.metric.activity .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.7rem; }

/* Sections */
.sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start; }
.section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid currentColor; }
.section-head h2 { color: var(--ink); }
.section-head .count { font-family: var(--font-mono); font-size: 0.85rem; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 18px 1fr; gap: 4px 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
.item > svg { width: 18px; height: 18px; margin-top: 2px; }
.item .body { min-width: 0; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item .t a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
.item .t a:hover { text-decoration-color: var(--accent); }
.item .m { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); overflow-wrap: anywhere; }
.item .dt { font-size: 0.86rem; color: var(--muted); overflow-wrap: anywhere; }
details.more summary { cursor: pointer; list-style: none; color: var(--accent); font-size: 0.85rem; padding: 8px 2px; }
details.more summary::-webkit-details-marker { display: none; }
.empty { color: var(--muted); font-size: 0.9rem; padding: 10px 2px; }

/* Bottom */
.bottom { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.box ul, .box ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.box li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.tag { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.r-high { color: var(--stop); } .r-medium { color: var(--wip); } .r-low { color: var(--idle); }
.w-me { color: var(--accent); } .w-you { color: var(--wait); }
.sources { color: var(--muted); font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 6px 16px; border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 640px) {
  .strip { grid-template-columns: 1fr; }
  .ring svg { width: 92px; height: 92px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ring .arc { transition: stroke-dashoffset 700ms ease-out; }
}
</style>

<script>
(function () {
  "use strict";
  var V;
  try { V = JSON.parse(document.getElementById("data").textContent); } catch (e) { V = null; }
  var root = document.getElementById("page");
  if (!V) { root.textContent = "Could not read the data."; return; }

  var STATUS = {
    done:      { l: "Done",          i: '<circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 9.2l2.3 2.3 4.7-4.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' },
    partial:   { l: "In progress",   i: '<circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 1.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/>' },
    blocked:   { l: "Blocked",       i: '<path d="M6 1.5h6L16.5 6v6L12 16.5H6L1.5 12V6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.5 9h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' },
    waiting:   { l: "Waiting on you", i: '<circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 6v6M11 6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' },
    attention: { l: "Attention",     i: '<path d="M9 2L16.5 15.5h-15z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="13.2" r="1" fill="currentColor"/>' },
    open:      { l: "Open",          i: '<circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.4 2.4"/>' }
  };
  function st(k) { return STATUS[k] ? k : "open"; }
  function icon(k) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 18 18"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = STATUS[st(k)].i; return s;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }
  function safeLink(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function chip(k, label) {
    var c = el("span", "chip s-" + st(k)); c.appendChild(icon(k));
    c.appendChild(document.createTextNode(label || STATUS[st(k)].l)); return c;
  }
  function level(s) {
    var t = String(s || "").toLowerCase();
    return t.indexOf("high") === 0 ? "high" : t.indexOf("med") === 0 ? "medium" : "low";
  }

  // Masthead
  var head = el("header", "masthead");
  var top = el("div", "top-line");
  top.appendChild(el("span", "kind", V.kind === "side-sessions" ? "Side sessions" : "Project status"));
  if (V.status) top.appendChild(chip(V.status));
  if (V.date) top.appendChild(el("span", "mono", V.date));
  head.appendChild(top);
  head.appendChild(el("h1", null, V.title || "Untitled"));
  if (V.subtitle) head.appendChild(el("p", "subtitle", V.subtitle));
  if (V.summary) { var p = el("p", "tldr"); p.appendChild(el("b", null, "TL;DR")); p.appendChild(document.createTextNode(V.summary)); head.appendChild(p); }
  root.appendChild(head);

  // Gauge strip
  var met = V.metrics || [];
  if (V.progress || met.length || V.activity) {
    var strip = el("section", "strip"); strip.setAttribute("aria-label", "Gauges");
    if (V.progress && typeof V.progress.percent === "number") {
      var y = Math.max(0, Math.min(100, V.progress.percent)), C = 2 * Math.PI * 46;
      var ring = el("div", "ring");
      ring.innerHTML = '<svg viewBox="0 0 112 112" role="img" aria-label="Progress ' + Math.round(y) + ' percent">' +
        '<circle cx="56" cy="56" r="46" fill="none" stroke="var(--line)" stroke-width="10"/>' +
        '<circle class="arc" cx="56" cy="56" r="46" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 56 56)" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - y / 100)).toFixed(2) + '"/>' +
        '<text class="pct" x="56" y="56" text-anchor="middle" dominant-baseline="central">' + Math.round(y) + '%</text></svg>';
      ring.appendChild(el("div", "label", V.progress.label || "complete"));
      strip.appendChild(ring);
    } else { strip.style.gridTemplateColumns = "1fr"; }
    var mk = el("div", "metrics");
    met.forEach(function (m) {
      var x = el("div", "metric");
      x.appendChild(el("span", "l", m.label)); x.appendChild(el("span", "v", m.value));
      if (m.note) x.appendChild(el("span", "n", m.note)); mk.appendChild(x);
    });
    var A = V.activity;
    if (A && A.values && A.values.length > 1) {
      var ak = el("div", "metric activity"), n = A.values.length, mx = Math.max.apply(null, A.values.concat([1]));
      var W = 280, H = 56, bw = W / n, svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + (A.label || "Activity") + '">';
      svg += '<line x1="0" y1="' + (H - 0.5) + '" x2="' + W + '" y2="' + (H - 0.5) + '" stroke="var(--line)" stroke-width="1"/>';
      A.values.forEach(function (v, i) {
        var bh = v > 0 ? Math.max(3, (v / mx) * (H - 6)) : 0;
        svg += '<rect x="' + (i * bw + 1.5).toFixed(1) + '" y="' + (H - 1 - bh).toFixed(1) + '" width="' + Math.max(1, bw - 3).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="1.5" fill="' + (i === n - 1 ? "var(--accent)" : "var(--idle)") + '" opacity="' + (i === n - 1 ? 1 : 0.55) + '"><title>' + ((A.days || [])[i] || "") + ": " + v + '</title></rect>';
      });
      ak.innerHTML = '<span class="l"></span>' + svg + '</svg>';
      ak.querySelector(".l").textContent = (A.label || "Activity") + " · max " + mx;
      if (A.days && A.days.length) {
        var ax = el("div", "axis mono"); ax.appendChild(el("span", null, A.days[0])); ax.appendChild(el("span", null, A.days[A.days.length - 1])); ak.appendChild(ax);
      }
      mk.appendChild(ak);
    }
    strip.appendChild(mk); root.appendChild(strip);
  }

  // Sections
  var secs = V.sections || [];
  if (secs.length) {
    var wrap = el("section", "sections");
    secs.forEach(function (s) {
      var items = s.items || [], sec = el("section", "section s-" + st(s.type));
      var sh = el("div", "section-head"); sh.appendChild(el("h2", null, s.title)); sh.appendChild(el("span", "count", items.length));
      sec.appendChild(sh);
      if (!items.length) { sec.appendChild(el("div", "empty", s.empty || "None.")); wrap.appendChild(sec); return; }
      function item(o) {
        var li = el("li", "item s-" + st(o.status || s.type)); li.appendChild(icon(o.status || s.type));
        var b = el("div", "body"), t = el("span", "t"), u = safeLink(o.link);
        if (u) { var a = el("a", null, o.title); a.href = u; a.target = "_blank"; a.rel = "noopener"; t.appendChild(a); }
        else t.textContent = o.title || "";
        b.appendChild(t);
        if (o.meta) b.appendChild(el("span", "m", o.meta));
        if (o.detail) b.appendChild(el("span", "dt", o.detail));
        li.appendChild(b); return li;
      }
      var LIM = 8, ul = el("ul", "items");
      items.slice(0, LIM).forEach(function (o) { ul.appendChild(item(o)); });
      sec.appendChild(ul);
      if (items.length > LIM) {
        var det = el("details", "more"), sm = el("summary", null, (items.length - LIM) + " more"), ul2 = el("ul", "items");
        items.slice(LIM).forEach(function (o) { ul2.appendChild(item(o)); });
        det.appendChild(sm); det.appendChild(ul2); sec.appendChild(det);
      }
      wrap.appendChild(sec);
    });
    root.appendChild(wrap);
  }

  // Risks and next steps
  var rk = V.risks || [], nx = V.next || [];
  if (rk.length || nx.length) {
    var bottom = el("section", "bottom");
    if (rk.length) {
      var b1 = el("div", "box"); b1.appendChild(el("h2", null, "Risks and blockers")); var u1 = el("ul");
      rk.forEach(function (r) { var li = el("li"); li.appendChild(el("span", "tag r-" + level(r.level), r.level || "Low")); li.appendChild(el("span", null, r.text)); u1.appendChild(li); });
      b1.appendChild(u1); bottom.appendChild(b1);
    }
    if (nx.length) {
      var b2 = el("div", "box"); b2.appendChild(el("h2", null, "Next")); var u2 = el("ol");
      nx.forEach(function (s) { var li = el("li"); var who = s.who === "you" ? "you" : "me"; li.appendChild(el("span", "tag w-" + who, who)); li.appendChild(el("span", null, s.text)); u2.appendChild(li); });
      b2.appendChild(u2); bottom.appendChild(b2);
    }
    root.appendChild(bottom);
  }

  if (V.sources && V.sources.length) {
    var src = el("footer", "sources"); src.appendChild(el("span", null, "Sources:"));
    V.sources.forEach(function (k) { src.appendChild(el("span", "mono", k)); });
    root.appendChild(src);
  }
})();
